name: Build and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  player:
    # Only new tags; deleting or moving an existing tag does not publish a release.
    if: github.event.created && !github.event.deleted
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            executable: dist/arduino-music/arduino-music
          - os: windows-2022
            platform: windows-x64
            executable: dist/arduino-music/arduino-music.exe
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies (including FFmpeg)
        run: python -m pip install -r requirements-dev.txt
      - name: Test conversion, Windows/Linux serial options and cleanup
        run: python -m unittest discover -s tests -v
      - name: Build portable player
        run: python scripts/build_release.py --platform ${{ matrix.platform }}
      - name: Test packaged player without system FFmpeg
        run: python scripts/smoke_release.py ${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: player-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  firmware:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install Uno core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Compile firmware and archive source
        run: |
          mkdir -p build/arduino_music release
          cp arduino_music.ino build/arduino_music/arduino_music.ino
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --output-dir build/firmware build/arduino_music
          cp build/firmware/arduino_music.ino.hex release/arduino-music-uno.hex
          git archive --format=zip --prefix=arduino_music/ HEAD -o release/arduino-music-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-and-source
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [player, firmware]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
